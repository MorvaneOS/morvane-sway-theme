# MorvaneOS look for Sway: generated by tools/build.py in morvane-sway-theme, edit that instead.
# Included by Sway's default config. Settings here override the ones above them there.

output * bg /usr/share/backgrounds/morvaneos/twilight.png fill

# The focused window has a Pastel Pink border as well as brighter title text, so it
# isn't told apart by colour alone.
#                       border     background  text      indicator  child_border
client.focused          #F4A6C6    #1A1220     #F5EEF3   #F4A6C6    #F4A6C6
client.focused_inactive #2A1C32    #1A1220     #A898AC   #2A1C32    #2A1C32
client.unfocused        #2A1C32    #150F1A     #8F7F96   #2A1C32    #2A1C32
client.urgent           #F0506E    #B3261E     #FFFFFF   #F0506E    #F0506E

# The default config's bar
bar bar-0 {
    colors {
        background #1A1220
        statusline #F5EEF3
        separator #2A1C32
        #                  border   background  text
        focused_workspace  #F4A6C6  #F4A6C6     #120C16
        active_workspace   #4A3552  #4A3552     #F5EEF3
        inactive_workspace #1A1220  #1A1220     #A898AC
        urgent_workspace   #F0506E  #B3261E     #FFFFFF
        binding_mode       #4A3552  #4A3552     #F5EEF3
    }
}
